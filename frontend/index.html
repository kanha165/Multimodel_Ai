<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multimodal AI Vision</title>
  <!-- styles will be added in next commit -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0d14; color: #e8e8f0; }
  </style>
</head>
<body>

<nav id="navbar">
  <span class="nav-brand">🧠 MultiModal AI</span>
  <ul class="nav-tabs" id="navTabs">
    <li><button onclick="showPanel('home')"     class="active"  data-panel="home">Home</button></li>
    <li><button onclick="showPanel('master')"   data-panel="master">🔮 Master AI</button></li>
    <li><button onclick="showPanel('vision')"   data-panel="vision">👁 Vision Q&amp;A</button></li>
    <li><button onclick="showPanel('ocr')"      data-panel="ocr">📝 OCR</button></li>
    <li><button onclick="showPanel('classify')" data-panel="classify">🏷 Classify</button></li>
    <li><button onclick="showPanel('product')"  data-panel="product">🛒 Product</button></li>
    <li><button onclick="showPanel('plant')"    data-panel="plant">🌿 Plant</button></li>
    <li><button onclick="showPanel('animal')"   data-panel="animal">🐾 Animal</button></li>
    <li><button onclick="showPanel('landmark')" data-panel="landmark">🏛 Landmark</button></li>
    <li><button onclick="showPanel('document')" data-panel="document">📄 Document</button></li>
    <li><button onclick="showPanel('search')"   data-panel="search">🔍 Search</button></li>
    <li><button onclick="showPanel('psearch')"  data-panel="psearch">🛍 Product Search</button></li>
  </ul>
</nav>

<main id="app">
  <p style="padding:2rem;color:#8888aa">Loading panels…</p>
</main>

<script>
  function showPanel(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
    const panel = document.getElementById('panel-' + name);
    if (panel) panel.classList.add('active');
    const btn = document.querySelector('[data-panel="' + name + '"]');
    if (btn) btn.classList.add('active');
  }
</script>
</body>
</html>
